          type: integer
        has_gcse_science_id:
          type: integer
        planning_to_retake_gcse_science_id:
          type: integer
        preferred_teaching_subject_id:
          type: string
        preferred_education_phase_id:
          type: integer
        initial_teacher_training_year_id:
          type: integer
        accepted_policy_id:
          type: string
        type_id:
          type: integer
        channel_id:
          type: integer
        candidate_id:
          type: string
        adviser_status_id:
          type: integer
        qualification_id:
          type: string
        creation_channel_source_id:
          type: integer
        creation_channel_service_id:
          type: integer
        creation_channel_activity_id:
          type: integer
        subject_taught_id:
          type: string
        past_teaching_position_id:
          type: string
        stage_taught_id:
          type: integer
        degree_country:
          type: string
        phone_call_scheduled_at:
          type: string
        situation:
          type: integer
        citizenship:
          type: integer
        visa_status:
          type: integer
        location:
          type: integer
