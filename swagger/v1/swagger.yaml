openapi: 3.0.1
info:
  title: API V1
  version: v1
tags:
- name: Callback Booking Quotas
  description: Endpoints for callback booking quotas
- name: Candidates
  description: Endpoints for candidate operations
- name: Get into Teaching
  description: Endpoints for the Get into Teaching service
- name: Lookup Items
  description: Endpoints for lookup items
- name: Mailing List
  description: Endpoints for the mailing list service
- name: Operations
  description: Endpoints for operations and health checks
- name: Pick List Items
  description: Endpoints for pick list items
- name: Privacy Policies
  description: Endpoints for privacy policies
- name: Schools Experience
  description: Endpoints for the schools experience service
- name: Teaching Event Buildings
  description: Endpoints for teaching event buildings
- name: Teaching Events
  description: Endpoints for searching and retrieving teaching events
- name: Teacher Training Adviser
  description: Endpoints for the teacher training adviser service
security:
- bearerAuth: []
paths:
  "/api/callback_booking_quotas":
    get:
      tags:
      - Callback Booking Quotas
      summary: Retrieves all callback booking quotas.
      operationId: GetCallbackBookingQuotas
      responses:
        200:
          description: successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallbackBookingQuota"
        401:
          $ref: "#/components/responses/Unauthorized"
  "/api/candidates/access_tokens":
    post:
      tags:
      - Candidates
      summary: Create an access token for an existing candidate.
      operationId: CreateCandidateAccessToken
      requestBody:
        description: Candidate details to create an access token.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExistingCandidateRequest"
      responses:
        204:
          description: no content
        400:
          description: bad request
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - error: BadRequest
                  message: "Email can't be blank"
        401:
          $ref: "#/components/responses/Unauthorized"
  "/api/get_into_teaching/callbacks":
    post:
      tags:
      - Get into Teaching
      summary: Schedule a callback for a candidate.
      description: Queues a candidate upsert job.
      operationId: BookGetIntoTeachingCallback
      requestBody:
        description: Candidate callback details.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetIntoTeachingCallback"
      responses:
        204:
          description: no content
        400:
          description: bad request
          content:
            application/json:
              example:
                errors:
                - error: BadRequest
                  message: "Email can't be blank"
        401:
          $ref: "#/components/responses/Unauthorized"
  "/api/get_into_teaching/matchbacks":
    post:
      tags:
      - Get into Teaching
      summary: Perform a matchback operation to retrieve a pre-populated sign up for the candidate.
      description: Retrieves an existing candidate record based on the provided details.
      operationId: MatchbackGetIntoTeachingCallback
      requestBody:
        description: Candidate details to matchback.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExistingCandidateRequest"
      responses:
        200:
          description: successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetIntoTeachingCallback"
        400:
          description: bad request
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - error: "BadRequest"
                  message: "Matchback failed: candidate not found"
        401:
          $ref: "#/components/responses/Unauthorized"
  "/api/get_into_teaching/candidates/exchange_access_token/{accessToken}":
    post:
      tags:
      - Get into Teaching
      summary: Exchange an access token for a full candidate sign-up.
      description: Exchanges an access token for a candidate's details to pre-populate a sign-up form.
      operationId: ExchangeAccessTokenForGetIntoTeachingCallback
      parameters:
      - name: accessToken
        in: path
        required: true
        description: The access token to exchange.
        schema:
          type: string
      requestBody:
        description: Candidate details to exchange.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExistingCandidateRequest"
      responses:
        200:
          description: successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetIntoTeachingCallback"
        400:
          description: bad request
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - error: "BadRequest"
                  message: "Email can't be blank"
        401:
          $ref: "#/components/responses/Unauthorized"
