components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API token passed as `Authorization: Bearer <token>`'
  schemas:
    CallbackBookingQuota:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "27d74cc7-7fa3-f011-bbd3-000d3a384b51"
        time_slot:
          type: string
          example: "9:30am - 10am"
        day:
          type: string
          example: "Thursday 30 April"
        start_at:
          type: string
          format: date-time
          example: "2026-04-30T08:30:00Z"
        end_at:
          type: string
          format: date-time
          example: "2026-04-30T09:00:00Z"
        number_of_bookings:
          type: integer
          format: int32
          example: 0
        quota:
          type: integer
          format: int32
          example: 20
        is_available:
          type: boolean
          example: true
      required:
      - id
      - time_slot
      - day
      - start_at
      - end_at
      - number_of_bookings
      - quota
      - is_available

    CandidateIdsRequest:
      type: object
      properties:
        candidate_ids:
          type: array
          description: The candidate IDs to backfill.
          items:
            type: integer
            format: int32
          example: [123, 456, 789]

    Country:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        value:
          type: string
          example: "United Kingdom"
        iso_code:
          type: string
          example: "GB"
      required:
      - id
      - value
      - iso_code

    PickListItem:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 222750000
        value:
          type: string
          example: "Example value"
      required:
      - id
      - value

    TeachingSubject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        value:
          type: string
          example: "Chemistry"

    PrivacyPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        text:
          type: string
          example: "This is a demo privacy policy for testing purposes."
        created_at:
          type: string
          format: date-time
          example: "2026-04-30T09:36:47.357Z"
      required:
      - id
      - text
      - created_at

    SchoolsExperienceSignUp:
      type: object
      properties:
        email:
          type: string
          example: "johndoe@example.com"
        first_name:
          type: string
          example: "John"
        last_name:
          type: string
          example: "Doe"
        preferred_teaching_subject_id:
          type: string
          example: "subject-1"
        secondary_preferred_teaching_subject_id:
          type: string
          example: "subject-2"
        address_line1:
          type: string
          example: "123 Main St"
        address_line2:
          type: string
          example: "Apt 4B"
        address_line3:
          type: string
          example: "Little Whinging"
        address_city:
          type: string
          example: "London"
        address_state_or_province:
          type: string
          example: "London"
        address_postcode:
          type: string
          example: "SW1A 1AA"
        telephone:
          type: string
          example: "01234567890"
        has_dbs_certificate:
          type: boolean
          example: true
        dbs_certificate_issued_at:
          type: string
          example: "2024-01-15"
        qualification_id:
          type: string
          example: "qual-1"
        degree_status_id:
          type: string
          example: "status-1"
        degree_type_id:
          type: string
          example: "type-1"
        degree_subject:
          type: string
          example: "Mathematics"
        uk_degree_grade_id:
          type: string
          example: "grade-1"
        candidate_id:
          type: string
          example: "candidate-1"
        creation_channel_source_id:
          type: string
          example: "source-1"
        creation_channel_service_id:
          type: string
          example: "service-1"
        creation_channel_activity_id:
          type: string
          example: "activity-1"
        accepted_policy_id:
          type: string
          example: "policy-1"
      required:
      - email
      - first_name
      - last_name
      - preferred_teaching_subject_id
      - address_line1
      - address_city
      - address_state_or_province
      - address_postcode
      - telephone
      - has_dbs_certificate
      - accepted_policy_id

    TeachingEventBuilding:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "3290fb7f-93b4-eb11-8236-000d3a26ba1b"
        venue:
          type: string
          example: "The Open University in Wales"
        address_line1:
          type: string
          example: "Custom House Street"
        address_line2:
          type: string
        address_line3:
          type: string
        address_city:
          type: string
          example: "Cardiff"
        address_postcode:
          type: string
          example: "CF10 1AP"
        image_url:
          type: string
      required:
      - id
      - venue

    TeachingEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        type_id:
          type: integer
          format: int32
          example: 222750000
        status_id:
          type: integer
          format: int32
          example: 222750001
        region_id:
          type: integer
          format: int32
          example: 222750002
        readable_id:
          type: string
          example: "12345"
        web_feed_id:
          type: string
          description: If set, the API will accept new attendees for this event (an external sign up should be used if this value is nil).
          example: "ABCDE"
        is_online:
          type: boolean
          example: false
        name:
          type: string
          example: "Get into Teaching - London"
        summary:
          type: string
          example: "An event for those interested in teaching."
        message:
          type: string
          description: Used to push miscellaneous messages to users (e.g. if an event is close to being booked out).
          example: "Limited spaces remaining"
        description:
          type: string
          example: "A full description of the event."
        video_url:
          type: string
          example: "https://www.youtube.com/watch?v=example"
        scribble_id:
          type: string
          example: "scribble-123"
        provider_website_url:
          type: string
          example: "https://www.example.com"
        provider_target_audience:
          type: string
          example: "Aspiring teachers"
        provider_organiser:
          type: string
          example: "Jane Smith"
        provider_contact_email:
          type: string
          format: email
          example: "jane.smith@example.com"
        start_at:
          type: string
          format: date-time
          example: "2026-07-15T10:00:00Z"
        end_at:
          type: string
          format: date-time
          example: "2026-07-15T16:00:00Z"
        providers_list:
          type: string
          example: "Provider A, Provider B"
        building:
          $ref: "#/components/schemas/TeachingEventBuilding"
        is_virtual:
          type: boolean
          readOnly: true
          example: false
        accessibility_options:
          type: array
          items:
            type: integer
            format: int32
          example: [222750000, 222750001]
        is_in_person:
          type: boolean
          readOnly: true
          example: true
      required:
      - readable_id
      - name
      - type_id
      - status_id
      - is_online
      - start_at
      - end_at

    TeachingEventSearchRequest:
      type: object
      properties:
        postcode:
          type: string
          description: Postcode to center search around.
          example: "SW1A 1AA"
        radius:
          type: integer
          format: int32
          description: Radius in miles to search around the postcode.
          example: 10
        type_ids:
          type: array
          items:
            type: integer
            format: int32
          description: Filter by teaching event type IDs.
          example: [222750000, 222750001]
        online:
          type: boolean
          description: Set to true for online events, false for in-person events.
          example: false
        start_after:
          type: string
          format: date-time
          description: Filter to events starting after this date.
          example: "2026-07-01T00:00:00Z"
        start_before:
          type: string
          format: date-time
          description: Filter to events starting before this date.
          example: "2026-08-01T00:00:00Z"
        status_ids:
          type: array
          items:
            type: integer
            format: int32
          description: Filter by event status IDs.
          example: [222750001]
        accessibility_options:
          type: array
          items:
