  "/api/teacher_training_adviser/candidates":
    post:
      tags:
      - Teacher Training Adviser
      summary: Sign up a candidate for the Teacher Training Adviser service.
      operationId: SignUpTeacherTrainingAdviserCandidate
      requestBody:
        description: Candidate to sign up for the Teacher Training Adviser service.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherTrainingAdviserSignUp"
            example:
              first_name: "John"
              last_name: "Doe"
              date_of_birth: "2000-01-01"
              email: "johndoe@example.com"
              address_telephone: "07735 111111"
              address_postcode: " BN1 1AA"
              country_id: "38ce2d0f-0b1f-ee11-9967-6045bd8c5762"
              degree_subject: "Mathematics"
              uk_degree_grade_id: 222750001
              degree_status_id: 222750000
              degree_type_id: 222750000
              has_gcse_maths_and_english_id: 222750000
              planning_to_retake_gcse_maths_and_english_id: 222750001
              has_gcse_science_id: 222750000
              planning_to_retake_gcse_science_id: 222750001
              preferred_teaching_subject_id: "b02655a1-2afa-e811-a981-000d3a276620"
              preferred_education_phase_id: 222750000
              initial_teacher_training_year_id: 222750001
              accepted_policy_id: "4872c8ed-0229-f111-8342-7c1e5285e3ab"
              type_id: 222750000
              channel_id: 222750049
              candidate_id: "d85a2f0b-290f-4931-98e2-e7d817ac38f3"
              qualification_id: "13da3277-c8ba-4b64-a79e-b0a3960c26be"
              creation_channel_source_id: 222750000
              creation_channel_service_id: 222750010
              creation_channel_activity_id: 222750017
      responses:
        200:
          description: successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeStatusResponse"
              example:
                degreeStatusId: 222750000
        400:
          description: bad request
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - "Email has already been taken"
                - "First name can't be blank"
        401:
          $ref: "#/components/responses/Unauthorized"
  "/api/teacher_training_adviser/candidates/exchange_access_token/{accessToken}":
    post:
      tags:
      - Teacher Training Adviser
      summary: Exchange an access token for a full candidate sign-up.
      operationId: ExchangeAccessTokenForTeacherTrainingAdviserSignUp
      parameters:
      - name: accessToken
        in: path
        required: true
        description: The access token to exchange.
        schema:
          type: string
      requestBody:
        description: Candidate details to exchange.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExistingCandidateRequest"
            example:
              email: "johndoe@example.com"
              first_name: "John"
              last_name: "Doe"
              date_of_birth: "2000-01-01"
      responses:
        200:
          description: successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherTrainingAdviserSignUp"
        400:
          description: bad request
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - "Email can't be blank"
                - "Email is invalid"
        401:
          $ref: "#/components/responses/Unauthorized"
  "/api/teacher_training_adviser/matchbacks":
    post:
      tags:
      - Teacher Training Adviser
      summary: Perform a matchback operation to retrieve a pre-populated sign up for the candidate.
      operationId: MatchbackCandidate
      requestBody:
        description: Candidate details to matchback.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExistingCandidateRequest"
            example:
              email: "johndoe@example.com"
              first_name: "John"
              last_name: "Doe"
              date_of_birth: "2000-01-01"
              reference: "ABC123"
      responses:
        200:
          description: successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherTrainingAdviserSignUp"
        400:
          description: bad request
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - "Matchback failed: candidate not found"
        401:
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API token passed as `Authorization: Bearer <token>`'
  schemas:
    CallbackBookingQuota:
      type: object
      properties:
        id:
          type: string
        time_slot:
          type: string
        day:
          type: string
        start_at:
          type: string
        end_at:
          type: string
        number_of_bookings:
          type: integer
        quota:
          type: integer
        is_available:
          type: boolean
      required:
      - id
      - time_slot
      - day
      - start_at
      - end_at
      - number_of_bookings
      - quota
      - is_available
    Country:
      type: object
      properties:
        id:
          type: string
        value:
          type: string
        iso_code:
          type: string
      required:
      - id
      - value
      - iso_code
    PickListItem:
      type: object
      properties:
        id:
          type: integer
        value:
          type: string
      required:
      - id
      - value
    TeachingSubject:
      type: object
      properties:
        id:
          type: string
        value:
          type: string
    PrivacyPolicy:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        created_at:
          type: string
      required:
      - id
      - text
      - created_at
    TeachingEventBuilding:
      type: object
      properties:
        id:
          type: string
        venue:
          type: string
        address_line1:
          type: string
        address_line2:
          type: string
        address_line3:
          type: string
        address_city:
          type: string
        address_postcode:
          type: string
        image_url:
          type: string
      required:
      - id
      - venue
    TeacherTrainingAdviserSignUp:
      type: object
      properties:
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
        address_telephone:
          type: string
        address_postcode:
          type: string
        country_id:
          type: string
        degree_subject:
          type: string
        uk_degree_grade_id:
          type: integer
        degree_status_id:
          type: integer
        degree_type_id:
          type: integer
        has_gcse_maths_and_english_id:
