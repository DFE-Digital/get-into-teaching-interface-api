  "/api/callback_booking_quotas":
    get:
      summary: list callback booking quotas
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        time_slot:
                          type: string
                        day:
                          type: string
                        start_at:
                          type: string
                          format: date-time
                        end_at:
                          type: string
                          format: date-time
                        number_of_bookings:
                          type: integer
                        quota:
                          type: integer
                        is_available:
                          type: boolean
                      required:
                      - id
                      - time_slot
                      - day
                      - start_at
                      - end_at
                      - number_of_bookings
                      - quota
                      - is_available
              examples:
                default:
                  value:
                    data:
                    - id: 27d74cc7-7fa3-f011-bbd3-000d3a384b51
                      time_slot: 9:30am - 10am
                      day: Thursday 30 April
                      start_at: '2026-04-30T08:30:00Z'
                      end_at: '2026-04-30T09:00:00Z'
                      number_of_bookings: 0
                      quota: 20
                      is_available: true
                    - id: 29d74cc7-7fa3-f011-bbd3-000d3a384b51
                      time_slot: 10am - 10:30am
                      day: Thursday 30 April
                      start_at: '2026-04-30T09:00:00Z'
                      end_at: '2026-04-30T09:30:00Z'
                      number_of_bookings: 0
                      quota: 20
                      is_available: true
