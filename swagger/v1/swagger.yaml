  "/api/callback_booking_quotas":
    get:
      tags:
      - Callback Booking Quotas
      summary: Retrieves all callback booking quotas.
      operationId: GetCallbackBookingQuotas
      responses:
        200:
          description: successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallbackBookingQuota"
              example:
              - id: "27d74cc7-7fa3-f011-bbd3-000d3a384b51"
                time_slot: "9:30am - 10am"
                day: "Thursday 30 April"
                start_at: "2026-04-30T08:30:00Z"
                end_at: "2026-04-30T09:00:00Z"
                number_of_bookings: 0
                quota: 20
                is_available: true
        401:
          $ref: "#/components/responses/Unauthorized"
