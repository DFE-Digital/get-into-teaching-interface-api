components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API token passed as `Authorization: Bearer <token>`'
  schemas:
    CallbackBookingQuota:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "27d74cc7-7fa3-f011-bbd3-000d3a384b51"
        time_slot:
          type: string
          example: "9:30am - 10am"
        day:
          type: string
          example: "Thursday 30 April"
        start_at:
          type: string
          format: date-time
          example: "2026-04-30T08:30:00Z"
        end_at:
          type: string
          format: date-time
          example: "2026-04-30T09:00:00Z"
        number_of_bookings:
          type: integer
          format: int32
          example: 0
        quota:
          type: integer
          format: int32
          example: 20
        is_available:
          type: boolean
          example: true
      required:
      - id
      - time_slot
      - day
      - start_at
      - end_at
      - number_of_bookings
      - quota
      - is_available

