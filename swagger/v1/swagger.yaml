components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API token passed as `Authorization: Bearer <token>`'
  schemas:
    CallbackBookingQuota:
      type: object
      properties:
        id:
          type: string
        time_slot:
          type: string
        day:
          type: string
        start_at:
          type: string
        end_at:
          type: string
        number_of_bookings:
          type: integer
        quota:
          type: integer
        is_available:
          type: boolean
      required:
      - id
      - time_slot
      - day
      - start_at
      - end_at
      - number_of_bookings
      - quota
      - is_available
    Country:
      type: object
      properties:
        id:
          type: string
        value:
          type: string
        iso_code:
          type: string
      required:
      - id
      - value
      - iso_code
    PickListItem:
      type: object
      properties:
        id:
          type: string
        value:
          type: string
      required:
      - id
      - value
    PrivacyPolicy:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        created_at:
          type: string
      required:
      - id
      - text
      - created_at
    TeachingEventBuilding:
      type: object
      properties:
        id:
          type: string
        venue:
          type: string
        address_line1:
          type: string
        address_line2:
          type: string
        address_line3:
          type: string
        address_city:
          type: string
        address_postcode:
          type: string
        image_url:
          type: string
      required:
      - id
      - venue
  responses:
    Unauthorized:
      description: unauthorized
      content:
        application/json:
          example:
            errors:
            - error: Unauthorized
              message: Please provide a valid authentication token
servers:
- url: http://localhost:3000
