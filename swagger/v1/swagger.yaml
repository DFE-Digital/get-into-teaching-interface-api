  "/api/mailing_list/members":
    post:
      tags:
      - Mailing List
      summary: Adds a new member to the mailing list.
      description: |
        If the candidate_id is specified then the existing candidate will be
        added to the mailing list, otherwise a new candidate will be created.
      operationId: AddMailingListMember
      requestBody:
        description: Member to add to the mailing list.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailingListAddMember"
            example:
              candidate_id: "d85a2f0b-290f-4931-98e2-e7d817ac38f3"
              first_name: "John"
              last_name: "Doe"
              email: "johndoe@example.com"
              accepted_policy_id: "4872c8ed-0229-f111-8342-7c1e5285e3ab"
              consideration_journey_stage_id: 222750000
              preferred_teaching_subject_id: "b02655a1-2afa-e811-a981-000d3a276620"
              degree_status_id: 222750000
              address_postcode: "BN1 1AA"
              graduation_year: 2028
      responses:
        200:
          description: successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeStatusResponse"
              example:
                degreeStatusId: 222750000
        400:
          description: bad request
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - error: BadRequest
                  message: "Email can't be blank"
        401:
          $ref: "#/components/responses/Unauthorized"
  "/api/mailing_list/members/exchange_access_token/{accessToken}":
    post:
      tags:
      - Mailing List
      summary: Exchange an access token for a mailing list member sign-up.
      operationId: ExchangeAccessTokenForMailingListMember
      parameters:
      - name: accessToken
        in: path
        required: true
        description: The access token to exchange.
        schema:
          type: string
      requestBody:
        description: Candidate details to exchange.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExistingCandidateRequest"
            example:
              email: "johndoe@example.com"
              first_name: "John"
              last_name: "Doe"
              date_of_birth: "2000-01-01"
      responses:
        200:
          description: successful
          content:
            application/json:
              schema:
                type: object
              example:
                degreeStatusId: 222750000
        400:
          description: bad request
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - "Email can't be blank"
                - "Email is invalid"
        401:
          $ref: "#/components/responses/Unauthorized"
