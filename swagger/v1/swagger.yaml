components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API token passed as `Authorization: Bearer <token>`'
  schemas:
    UnauthorizedError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
      - error
      - message
    PickListItem:
      type: object
      properties:
        id:
          type: string
        value:
          type: string
      required:
      - id
      - value
  responses:
    Unauthorized:
      description: unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  "$ref": "#/components/schemas/UnauthorizedError"
          examples:
            unauthorized:
              value:
                errors:
                - error: Unauthorized
                  message: Please provide a valid authentication token
servers:
- url: http://localhost:3000
