  "/api/teaching_events/search":
    get:
      tags:
      - Teaching Events
      summary: Searches for teaching events.
      description: |
        Searches for teaching events. Optionally limit the results by
        distance (in miles) from a postcode, event type, start date, and more.
      operationId: SearchTeachingEvents
      parameters:
      - name: postcode
        in: query
        description: Postcode to center the search around.
        schema:
          type: string
      - name: radius
        in: query
        description: Radius in miles to search around the postcode.
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: type_ids
        in: query
        description: Filter by teaching event type IDs.
        schema:
          type: array
          items:
            type: integer
            format: int32
        style: form
        explode: true
      - name: online
        in: query
        description: Set to true for online events, false for in-person events.
        schema:
          type: boolean
      - name: start_after
        in: query
        description: Filter to events starting after this date.
        example: "2025-07-01T00:00:00Z"
        schema:
          type: string
          format: date-time
      - name: start_before
        in: query
        description: Filter to events starting before this date.
        schema:
          type: string
          format: date-time
      - name: status_ids
        in: query
        description: Filter by event status IDs.
        schema:
          type: array
          items:
            type: integer
            format: int32
        style: form
        explode: true
      - name: accessibility_options
        in: query
        description: Filter by accessibility option IDs.
        schema:
          type: array
          items:
            type: integer
            format: int32
        style: form
        explode: true
      - name: quantity
        in: query
        description: Maximum number of results to return.
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        200:
          description: successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeachingEvent"
        400:
          description: bad request
          content:
            application/json:
              example:
                errors:
                - error: BadRequest
                  message: "Postcode must be a valid UK postcode"
        401:
          $ref: "#/components/responses/Unauthorized"
