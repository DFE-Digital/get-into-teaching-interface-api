apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: get-into-teaching-interface-api-production.teacherservices.cloud
spec:
  ingressClassName: nginx
  rules:
  - host: get-into-teaching-interface-api-production.teacherservices.cloud
    http:
      paths:
      - pathType: ImplementationSpecific
        backend:
          service:
            name: get-into-teaching-interface-api-maintenance
            port:
              number: 80
