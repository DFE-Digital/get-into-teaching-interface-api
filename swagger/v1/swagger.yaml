  "/api/mailing_list/members":
    post:
      tags:
      - Mailing List
      summary: Adds a new member to the mailing list.
      description: |
        If the candidate_id is specified then the existing candidate will be
        added to the mailing list, otherwise a new candidate will be created.
      operationId: AddMailingListMember
      requestBody:
        description: Member to add to the mailing list.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailingListAddMember"
      responses:
        200:
          description: successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeStatusResponse"
        400:
          description: bad request
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - error: BadRequest
                  message: "Email can't be blank"
        401:
          $ref: "#/components/responses/Unauthorized"
  "/api/mailing_list/members/exchange_access_token/{accessToken}":
