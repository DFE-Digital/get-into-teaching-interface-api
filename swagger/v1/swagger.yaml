openapi: 3.0.1
info:
  title: API V1
  version: v1
tags:
- name: Callback Booking Quotas
  description: Endpoints for callback booking quotas
- name: Candidates
  description: Endpoints for candidate operations
- name: Lookup Items
  description: Endpoints for lookup items
- name: Mailing List
  description: Endpoints for the mailing list service
- name: Pick List Items
  description: Endpoints for pick list items
- name: Privacy Policies
  description: Endpoints for privacy policies
- name: Teaching Event Buildings
  description: Endpoints for teaching event buildings
- name: Teacher Training Adviser
  description: Endpoints for the teacher training adviser service
security:
- bearerAuth: []
paths:
  "/api/callback_booking_quotas":
    get:
      tags:
      - Callback Booking Quotas
      summary: Retrieves all callback booking quotas.
      operationId: GetCallbackBookingQuotas
      responses:
        200:
          description: successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallbackBookingQuota"
              example:
              - id: "27d74cc7-7fa3-f011-bbd3-000d3a384b51"
                time_slot: "9:30am - 10am"
                day: "Thursday 30 April"
                start_at: "2026-04-30T08:30:00Z"
                end_at: "2026-04-30T09:00:00Z"
                number_of_bookings: 0
                quota: 20
                is_available: true
        401:
          $ref: "#/components/responses/Unauthorized"
  "/api/candidates/access_tokens":
    post:
      tags:
      - Candidates
      summary: Create an access token for an existing candidate.
      operationId: CreateCandidateAccessToken
      requestBody:
        description: Candidate details to create an access token.
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              email: "johndoe@example.com"
              first_name: "John"
              last_name: "Doe"
              date_of_birth: "2000-01-01"
      responses:
        200:
          description: successful
        400:
          description: bad request
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - "Email can't be blank"
                - "Email is invalid"
        401:
          $ref: "#/components/responses/Unauthorized"
  "/api/lookup_items/countries":
    get:
      tags:
      - Lookup Items
      summary: list countries
      operationId: GetCountries
      responses:
        200:
          description: successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"
              example:
              - id: "123e4567-e89b-12d3-a456-426614174000"
                value: "United Kingdom"
                iso_code: "GB"
              - id: "223e4567-e89b-12d3-a456-426614174001"
                value: "France"
                iso_code: "FR"
        401:
          $ref: "#/components/responses/Unauthorized"
  "/api/lookup_items/degree_countries":
